<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      The page parses saves locally and talks to nothing, so it can afford a
      tight policy. Two allowances are load-bearing:
        'wasm-unsafe-eval'  the Oodle decoder is WebAssembly, which counts as
                            script execution and is refused without it.
        blob: in worker-src the bundler serves the parsing worker from a blob.
      There is deliberately no remote origin anywhere in this policy — if a
      future change tried to upload a save, it would fail here first.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' data: blob:; form-action 'none'; base-uri 'self'"
    />

    <title>PalBoard — read your Palworld save in the browser</title>
    <meta
      name="description"
      content="A dashboard for your Palworld save: every pal, base, chest and statistic, read locally in your browser. Nothing is uploaded and saves are never modified."
    />
    <meta name="theme-color" content="#0a0c11" />
    <meta name="color-scheme" content="dark" />

    <!-- Link previews, for when this gets shared. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="PalBoard — read your Palworld save in the browser" />
    <meta
      property="og:description"
      content="Every pal, base, chest and statistic in your world. Runs entirely in your browser — no upload, no account, read-only."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      PalBoard decodes your save file in the browser, so it needs JavaScript enabled.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
